services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/laser-power-infra/django-worker:${APP_VERSION:-latest}
    command: uv run python -m worker.ingestion_worker
    restart: unless-stopped
    env_file:
      - .env.production
    networks:
      - infra
    # ponytail: no depends_on — postgres/qdrant/rabbitmq external at 192.168.1.190, add services when self-hosted

networks:
  infra:
    external: true
