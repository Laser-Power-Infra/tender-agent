[project]
name = "tender-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bidyutdas@laser", email = "bidyutdas.laserpowerinfra@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.1",
    "docling>=2.124.0",
    "fastembed>=0.8.0",
    "google-api-python-client>=2.200.0",
    "google-auth>=2.57.1",
    "google-auth-oauthlib>=1.4.1",
    "httpx>=0.28.1",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.15.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=2.0.15",
    "openpyxl>=3.1.5",
    "pika>=1.4.4",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=5.0.0",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=6.0.1",
    "sqlmodel>=0.0.42",
    # transitive via docling + sentence-transformers, declared so the CPU index below binds to them
    "torch>=2.0",
    "torchvision>=0.15",
]

[tool.uv]
package = false

# ponytail: RERANK_DEVICE is cpu and nothing here ever touches a GPU, so take the CPU wheels.
# the default index drags in nvidia-cublas/cudnn/nccl/triton — GBs of image for code that never runs.
# switch to a cuXXX index here if a GPU host ever appears.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
